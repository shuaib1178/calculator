<body style="margin: 0; background-color: #fcfbfd;">

            <svg width="48" height="48" viewBox="0 0 50 50" aria-hidden="true" style="margin-bottom: 1rem;">
                <circle cx="25" cy="25" r="20" fill="none" stroke="#e0e1e0" stroke-width="5"></circle>
                <circle cx="25" cy="25" r="20" fill="none" stroke="#054f49" stroke-width="5" stroke-dasharray="31.4 31.4" stroke-linecap="round">

            <span style="color: #054f49; font-weight: 500; font-size: 1.125rem;">Loading Hirdog School System...</span>
