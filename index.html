<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hirdog School System</title>
    <style>
        #initial-loader {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #fcfbfd;
            z-index: 9999;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #c0c1c0;
            border-top: 4px solid #054f49;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>

<body>
    <div id="root">
        <div id="initial-loader" role="status" aria-live="polite">
            <div class="spinner"></div>
            <p style="color: #054f49; font-weight: 500;">Loading Hirdog School System...</p>
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
