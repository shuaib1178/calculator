<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hirdog School System</title>
</head>

<body>
    <div id="root">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fcfbfd; font-family: sans-serif;">
            <div style="text-align: center;">
                <div style="display: inline-block; width: 48px; height: 48px; border: 4px solid #054f4920; border-top: 4px solid #054f49; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                <p style="margin-top: 16px; color: #054f49; font-weight: 500;" role="status">Loading Hirdog School System...</p>
            </div>
            <style>
                @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            </style>
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
