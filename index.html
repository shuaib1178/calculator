<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#054f49" />
    <title>Hirdog School System</title>
</head>

<body>
    <div id="root">
        <style>
            .initial-loader-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                background-color: #fcfbfd;
                font-family: system-ui, -apple-system, sans-serif;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid #c0c1c0;
                border-top: 4px solid #054f49;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-bottom: 1rem;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .loader-text {
                color: #054f49;
                font-weight: 500;
            }
        </style>
        <div class="initial-loader-container" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <span class="loader-text">Loading Hirdog School System...</span>
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
