<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hirdog School System</title>
</head>

<body>
    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif" aria-live="polite" aria-busy="true">
            <div style="width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #054f49;border-radius:50%;animation:s 1s linear infinite" role="status"></div>
            <style>@keyframes s{to{transform:rotate(360deg)}}</style>
            <p style="color:#054f49;margin-top:1rem">Loading School System...</p>
        </div>
    </div>
    <noscript>
        <div style="text-align:center;padding:2rem;font-family:sans-serif">
            <h1>JavaScript Required</h1>
            <p>Please enable JavaScript to use the Hirdog School System.</p>
        </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
