<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hirdog School System - Professional school management and administration platform." />
    <meta name="theme-color" content="#054f49" />
    <title>Hirdog School System</title>
    <style>
        #initial-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fcfbfd;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
            gap: 1.25rem;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #6b7280;
            border-top: 4px solid #054f49;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .loading-text {
            color: #054f49;
            font-weight: 500;
            font-size: 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .noscript-container {
            padding: 2rem;
            text-align: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: #054f49;
        }
    </style>
</head>

<body>
    <noscript>
        <div class="noscript-container">
            <h1>JavaScript Required</h1>
            <p>Please enable JavaScript to use the Hirdog School System.</p>
        </div>
    </noscript>
    <div id="root">
        <div id="initial-loader" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <span class="loading-text">Loading Hirdog School System...</span>
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
