<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hirdog School System</title>
    <style>
        .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; background-color: #fcfbfd; }
        .spinner { width: 40px; height: 40px; border: 4px solid #c0c1c0; border-top: 4px solid #054f49; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { margin-top: 1rem; font-family: system-ui, -apple-system, sans-serif; color: #054f49; font-weight: 500; }
    </style>
</head>

<body>
    <div id="root">
        <div class="loading-container">
            <div class="spinner" role="status" aria-label="Loading"></div>
            <p class="loading-text">Loading Hirdog School System...</p>
        </div>
    </div>
    <noscript>
        <div style="text-align: center; padding: 2rem; font-family: system-ui, -apple-system, sans-serif; color: #054f49;">
            <h1>JavaScript Required</h1>
            <p>We're sorry, but Hirdog School System requires JavaScript to be enabled to function properly.</p>
        </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
