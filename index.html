<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hirdog School System</title>
    <style>
        #initial-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fcfbfd;
            z-index: 9999;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(5, 79, 73, 0.1);
            border-left-color: #054f49;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 1rem;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #054f49;
            font-weight: 500;
        }
    </style>
</head>

<body style="background-color: #fcfbfd;">
    <div id="root">
        <div id="initial-loader" role="status" aria-live="polite">
            <div class="spinner"></div>
            <p class="loading-text">Loading Hirdog School System...</p>
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
