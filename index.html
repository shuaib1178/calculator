<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hirdog School System</title>
    <style>
        #initial-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: #fcfbfd; z-index: 9999;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #6b7280; border-bottom-color: #054f49;
            border-radius: 50%; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .loader-text { margin-top: 1rem; color: #054f49; font-family: sans-serif; font-weight: 500; }
    </style>
</head>

<body>
    <noscript>
        <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
            <h1>JavaScript Required</h1>
            <p>Please enable JavaScript to use the Hirdog School System.</p>
        </div>
    </noscript>
    <div id="root">
        <div id="initial-loader" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <span class="loader-text" aria-live="polite">Loading Hirdog School System...</span>
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
